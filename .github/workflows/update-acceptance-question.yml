name: Update acceptance question

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-question:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update question text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Heeft een verzekeraar in de afgelopen 5 jaar een verzekering van jou, een gezinslid of andere meeverzekerde personen opgezegd of geweigerd?'
          new = 'Heeft een verzekeraar in de afgelopen 5 jaar een verzekering van jou of personen die onder deze verzekering vallen, zoals bijvoorbeeld je gezinsleden of huisgenoten, opgezegd of geweigerd?'
          if old not in text:
              raise SystemExit('oude vraagtekst niet gevonden')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update acceptance question text"
          git push
