name: Update compliance speech behavior

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-checklist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update checklist speech logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label}: verwachte tekst niet gevonden')
              text = text.replace(old, new, 1)

          replace_once(
              '<label class="checkline"><input type="checkbox" id="check_3_1a"><span>Heb je de auto zakelijk gekocht of gefinancierd? Of gebruik je de auto zakelijk?</span></label>',
              '<label class="checkline"><input type="checkbox" id="check_3_1a"><span>Heb je het voertuig zakelijk gekocht of gefinancierd? Of gebruik je het voertuig zakelijk?</span></label>',
              'objectgebonden zakelijke vraag'
          )
          replace_once(
              '<label class="checkline"><input type="checkbox" id="check_3_1b"><span><strong>Op welke naam staat het kenteken van de auto?</strong></span></label>',
              '<label class="checkline"><input type="checkbox" id="check_3_1b"><span><strong>Op welke naam staat het kenteken van het voertuig?</strong></span></label>',
              'objectgebonden kentekenvraag'
          )

          replace_once(
              'check_3_5: "Heeft een verzekeraar in de afgelopen 5 jaar een verzekering van jou, een gezinslid of andere meeverzekerde personen opgezegd of geweigerd? Het gaat niet om verzekeringen die iemand zelf heeft opgezegd.",',
              'check_3_5: "Heeft een verzekeraar in de afgelopen 5 jaar een verzekering van jou of personen die onder deze verzekering vallen, zoals bijvoorbeeld je gezinsleden of huisgenoten, opgezegd of geweigerd? Het gaat niet om verzekeringen die iemand zelf heeft opgezegd.",',
              'letterlijk doel acceptatievraag 1'
          )

          replace_once(
              '''      const politeVariants = {\n        je:"u", jij:"u", jou:"u", u:"u",\n        jouw:"uw", uw:"uw",\n        bent:"ben", heeft:"heb", hoeft:"hoef",\n        bekijken:"kijken", we:"wij"\n      };''',
              '''      const politeVariants = {\n        je:"u_vorm", jij:"u_vorm", jou:"u_vorm", jouw:"u_vorm", u:"u_vorm", uw:"u_vorm",\n        bent:"ben", heeft:"heb", hoeft:"hoef", wil:"wilt",\n        bekijken:"kijken", we:"wij"\n      };''',
              'u/uw en je/jij/jou normalisatie'
          )

          insertion_point = '''    const strictWordProgress = {};\n    const strictPreviewProgress = {};\n'''
          vehicle_logic = '''    const strictWordProgress = {};\n    const strictPreviewProgress = {};\n\n    const vehicleObjects = [\n      { key: "bestelauto", label: "bestelauto", article: "de", aliases: ["bestelauto", "bestelwagen"] },\n      { key: "motor", label: "motor", article: "de", aliases: ["motorfiets", "motor"] },\n      { key: "brommer", label: "brommer", article: "de", aliases: ["bromfiets", "brommer"] },\n      { key: "snorfiets", label: "snorfiets", article: "de", aliases: ["snorfiets"] },\n      { key: "scooter", label: "scooter", article: "de", aliases: ["scooter"] },\n      { key: "camper", label: "camper", article: "de", aliases: ["camper", "kampeerauto"] },\n      { key: "caravan", label: "caravan", article: "de", aliases: ["caravan"] },\n      { key: "aanhanger", label: "aanhanger", article: "de", aliases: ["aanhangwagen", "aanhanger", "trailer"] },\n      { key: "oldtimer", label: "oldtimer", article: "de", aliases: ["oldtimer"] },\n      { key: "auto", label: "auto", article: "de", aliases: ["personenauto", "auto", "wagen"] }\n    ];\n    const genericVehicleObject = { key: "voertuig", label: "voertuig", article: "het", aliases: [] };\n    let currentVehicleObject = genericVehicleObject;\n\n    function vehiclePhrase() {\n      return `${currentVehicleObject.article} ${currentVehicleObject.label}`;\n    }\n\n    function detectVehicleObject(text) {\n      const normalized = normalizeSpeech(text);\n      if (!normalized) return null;\n      const matches = [];\n      vehicleObjects.forEach(object => object.aliases.forEach(alias => {\n        const term = normalizeSpeech(alias);\n        const pattern = new RegExp(`(^|\\\\s)${term.replace(/[.*+?^${}()|[\\\\]\\\\]/g, "\\\\$&")}($|\\\\s)`);\n        if (pattern.test(normalized)) matches.push({ object, length: term.length });\n      }));\n      matches.sort((a, b) => b.length - a.length);\n      return matches[0]?.object || null;\n    }\n\n    function containsVehicleObject(text) {\n      return Boolean(detectVehicleObject(text));\n    }\n\n    function updateVehicleObjectUI() {\n      const phrase = vehiclePhrase();\n      const businessBox = document.getElementById("check_3_1a");\n      const registrationBox = document.getElementById("check_3_1b");\n      const businessText = `Heb je ${phrase} zakelijk gekocht of gefinancierd? Of gebruik je ${phrase} zakelijk?`;\n      const registrationText = `Op welke naam staat het kenteken van ${phrase}?`;\n\n      const businessLabel = businessBox?.closest(".checkline")?.querySelector(":scope > span");\n      if (businessLabel) businessLabel.textContent = businessText;\n      const registrationLabel = registrationBox?.closest(".checkline")?.querySelector(":scope > span");\n      if (registrationLabel) registrationLabel.innerHTML = `<strong>${registrationText}</strong>`;\n\n      if (overlayWindow && !overlayWindow.closed) {\n        const businessOverlay = overlayWindow.document.querySelector('[data-check-id="check_3_1a"] > span');\n        if (businessOverlay) businessOverlay.textContent = businessText;\n        const registrationOverlay = overlayWindow.document.querySelector('[data-check-id="check_3_1b"] > span');\n        if (registrationOverlay) registrationOverlay.innerHTML = `<strong>${registrationText}</strong>`;\n      }\n    }\n\n    function setVehicleObject(object) {\n      if (!object || currentVehicleObject.key === object.key) return;\n      currentVehicleObject = object;\n      updateVehicleObjectUI();\n    }\n\n    function resetVehicleObject() {\n      currentVehicleObject = genericVehicleObject;\n      updateVehicleObjectUI();\n    }\n\n    function updateVehicleObjectFromSpeech(text) {\n      if (!document.getElementById("check_3_0")?.checked) return;\n      const detected = detectVehicleObject(text);\n      if (detected) setVehicleObject(detected);\n    }\n'''
          replace_once(insertion_point, vehicle_logic, 'objectherkenning invoegpunt')

          replace_once(
              'check_3_1a: ["gebruik je de auto zakelijk", "auto zakelijk"],',
              'check_3_1a: ["zakelijk gekocht", "zakelijk gefinancierd", "zakelijk"],',
              'spraakregel zakelijke objectvraag'
          )
          replace_once(
              'check_3_1b: ["op welke naam staat het kenteken van de auto", "naam staat het kenteken", "kenteken van de auto"],',
              'check_3_1b: ["op welke naam staat het kenteken", "naam staat het kenteken", "kenteken staat op naam"],',
              'spraakregel kenteken objectvraag'
          )
          replace_once(
              'check_3_1a: text => text.includes("auto") && text.includes("zakelijk"),',
              'check_3_1a: text => text.includes("zakelijk") && (containsVehicleObject(text) || currentVehicleObject.key !== "voertuig"),',
              'flexibele matcher zakelijke objectvraag'
          )

          replace_once(
              '''    function resetChecks() {\n      boxes.forEach(box => {\n        box.checked = false;\n        localStorage.setItem("werkcheck_" + box.id, "false");\n        if (strictReadingTargets[box.id]) strictWordProgress[box.id] = 0;\n      });\n      setCommunicationMode(null);\n      setCriminalAnswer(null);\n    }''',
              '''    function resetChecks() {\n      boxes.forEach(box => {\n        box.checked = false;\n        localStorage.setItem("werkcheck_" + box.id, "false");\n        if (strictReadingTargets[box.id]) {\n          strictWordProgress[box.id] = 0;\n          strictPreviewProgress[box.id] = 0;\n        }\n      });\n      resetVehicleObject();\n      setCommunicationMode(null);\n      setCriminalAnswer(null);\n      syncOverlay();\n    }''',
              'reset voorleesvoortgang'
          )

          replace_once(
              '''        if (finalText.trim()) {\n          // Controleer uitsluitend deze nieuwe, afgeronde spraakuiting.\n          // Te vroeg uitgesproken woorden worden dus niet onthouden.\n          rollingFinalText = finalText.trim();\n          processSpeech(finalText);\n          processAcceptanceAnswer(finalText);\n        }\n        if (interimText.trim()) previewStrictReading(interimText);''',
              '''        if (finalText.trim()) {\n          // Het voertuig wordt gespreksspecifiek herkend zodra de automatische\n          // besluitvorming is afgerond. Hierdoor veranderen objectgebonden\n          // vragen direct mee met auto, motor, brommer, camper, caravan, enz.\n          updateVehicleObjectFromSpeech(finalText);\n          // Controleer uitsluitend deze nieuwe, afgeronde spraakuiting.\n          // Te vroeg uitgesproken woorden worden dus niet onthouden.\n          rollingFinalText = finalText.trim();\n          processSpeech(finalText);\n          // Als juist deze uiting de automatische besluitvorming afrondde,\n          // probeer objectherkenning daarna nogmaals.\n          updateVehicleObjectFromSpeech(finalText);\n          processAcceptanceAnswer(finalText);\n        }\n        if (interimText.trim()) {\n          updateVehicleObjectFromSpeech(interimText);\n          previewStrictReading(interimText);\n        }''',
              'live objectherkenning in spraakresultaten'
          )

          replace_once(
              '''    const savedCriminalAnswer = localStorage.getItem("criminal_answer");\n    applyCommunicationMode(localStorage.getItem("communication_mode"));''',
              '''    const savedCriminalAnswer = localStorage.getItem("criminal_answer");\n    resetVehicleObject();\n    applyCommunicationMode(localStorage.getItem("communication_mode"));''',
              'initiele generieke voertuigtekst'
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve compliance speech reset and vehicle detection"
          git push