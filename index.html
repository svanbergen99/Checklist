<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist – Controleren</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header><h1><span class="tick">✓</span>Checklist – Controleren</h1></header>

    <aside class="speech-panel" aria-label="Spraakherkenning">
      <div class="speech-controls">
        <button id="listenButton" type="button">🎙 Start meeluisteren</button>
        <button id="endButton" type="button">Einde gesprek</button>
        <span id="listenStatus">Microfoon staat uit</span>
      </div>
      <div id="transcript" aria-live="polite">Hier verschijnt wat de browser herkent…</div>
      <p class="speech-note">Proefversie: controleer de vinkjes altijd zelf. De herkende tekst wordt niet in deze checklist opgeslagen.</p>
    </aside>

    <main id="checklistRoot"></main>

    <div class="buttons">
      <button id="overlayButton" type="button">Open overlay</button>
      <button id="fullscreenButton" type="button">Fullscreen</button>
    </div>
  </div>

  <script src="checklist-data.js"></script>
  <script src="checklist-state.js"></script>
  <script src="vehicle-detection.js"></script>
  <script src="checklist-ui.js"></script>
  <script src="speech.js"></script>
  <script src="overlay.js?v=iframe1"></script>
  <script src="app.js"></script>
</body>
</html>
